apiVersion: v1
kind: Namespace
metadata:
  name: kern
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kern-agent
  namespace: kern
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kern-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kern-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kern-agent
subjects:
  - kind: ServiceAccount
    name: kern-agent
    namespace: kern
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kern-agent
  namespace: kern
  labels:
    app: kern-agent
spec:
  selector:
    matchLabels:
      app: kern-agent
  template:
    metadata:
      labels:
        app: kern-agent
    spec:
      serviceAccountName: kern-agent
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: kern/agent:latest
          imagePullPolicy: Never
          args:
            - "-addr"
            - ":9474"
            - "-mode"
            - "ebpf"
          ports:
            - name: http
              containerPort: 9474
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBELET_PODS_DIR
              value: /var/lib/kubelet/pods
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: sys
              mountPath: /sys
            - name: kernel-debug
              mountPath: /sys/kernel/debug
            - name: kernel-tracing
              mountPath: /sys/kernel/tracing
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: kernel-debug
          hostPath:
            path: /sys/kernel/debug
        - name: kernel-tracing
          hostPath:
            path: /sys/kernel/tracing
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: kern-agent
  namespace: kern
spec:
  selector:
    app: kern-agent
  ports:
    - name: http
      port: 9474
      targetPort: 9474
