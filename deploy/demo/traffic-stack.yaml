apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    app.kubernetes.io/part-of: kern-demo-traffic
---
# Single-node Elasticsearch — low heap for Multipass workers (~2Gi RAM).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: demo
  labels:
    app: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
            - name: bootstrap.memory_lock
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 400Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=1s
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: demo
  labels:
    app: elasticsearch
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
---
# APM Server → Elasticsearch (agents talk to this on :8200).
apiVersion: v1
kind: ConfigMap
metadata:
  name: apm-server-config
  namespace: demo
data:
  apm-server.yml: |
    apm-server:
      host: "0.0.0.0:8200"
    output.elasticsearch:
      hosts: ["http://elasticsearch.demo.svc.cluster.local:9200"]
    logging.level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-server
  namespace: demo
  labels:
    app: apm-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apm-server
  template:
    metadata:
      labels:
        app: apm-server
    spec:
      containers:
        - name: apm-server
          image: docker.elastic.co/apm/apm-server:8.15.3
          args: ["-c", "/usr/share/apm-server/apm-server.yml", "-e"]
          ports:
            - name: http
              containerPort: 8200
          volumeMounts:
            - name: config
              mountPath: /usr/share/apm-server/apm-server.yml
              subPath: apm-server.yml
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8200
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 18
      volumes:
        - name: config
          configMap:
            name: apm-server-config
---
apiVersion: v1
kind: Service
metadata:
  name: apm-server
  namespace: demo
  labels:
    app: apm-server
spec:
  selector:
    app: apm-server
  ports:
    - name: http
      port: 8200
      targetPort: 8200
---
# Lightweight Node "app" with Elastic APM agent sending traces to apm-server.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app
  namespace: demo
data:
  package.json: |
    {
      "name": "kern-demo-app",
      "version": "1.0.0",
      "private": true,
      "dependencies": {
        "elastic-apm-node": "4.7.3",
        "express": "4.21.2"
      }
    }
  server.js: |
    require('elastic-apm-node').start({
      serviceName: 'kern-demo-app',
      serverUrl: process.env.ELASTIC_APM_SERVER_URL || 'http://apm-server.demo.svc.cluster.local:8200',
      environment: 'demo',
      active: true,
    });
    const express = require('express');
    const http = require('http');
    const app = express();
    app.get('/health', (_req, res) => res.json({ ok: true }));
    app.get('/work', async (_req, res) => {
      await new Promise((r) => setTimeout(r, 15 + Math.floor(Math.random() * 40)));
      res.json({ work: 'done', ts: Date.now() });
    });
    app.listen(3000, () => console.log('demo-app listening on :3000'));
    // Keep generating outbound traffic + APM spans.
    setInterval(() => {
      http.get('http://127.0.0.1:3000/work', (r) => { r.resume(); }).on('error', () => {});
      http.get('http://elasticsearch.demo.svc.cluster.local:9200/', (r) => { r.resume(); }).on('error', () => {});
    }, 4000);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: node:20-alpine
          workingDir: /app
          command: ["sh", "-c"]
          args:
            - |
              set -e
              cp /config/package.json /config/server.js /app/
              npm install --omit=dev --no-audit --no-fund
              node server.js
          env:
            - name: ELASTIC_APM_SERVER_URL
              value: http://apm-server.demo.svc.cluster.local:8200
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
      volumes:
        - name: config
          configMap:
            name: demo-app
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
spec:
  selector:
    app: demo-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Kafka-compatible broker via Redpanda (lighter than Bitnami Kafka; arm64-friendly).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: demo
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp
            - "1"
            - --memory
            - 384M
            - --reserve-memory
            - 0M
            - --node-id
            - "0"
            - --check=false
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr
            - PLAINTEXT://kafka.demo.svc.cluster.local:9092
            - --rpc-addr
            - 0.0.0.0:33145
            - --advertise-rpc-addr
            - kafka.demo.svc.cluster.local:33145
          ports:
            - name: kafka
              containerPort: 9092
            - name: rpc
              containerPort: 33145
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 8
            failureThreshold: 18
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: demo
  labels:
    app: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
# Continuous DNS + HTTP + Kafka churn so Network → DNS/Protocols light up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-gen
  namespace: demo
  labels:
    app: traffic-gen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-gen
  template:
    metadata:
      labels:
        app: traffic-gen
    spec:
      containers:
        - name: dns-http
          image: alpine:3.20
          command: ["sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache curl bind-tools busybox-extras >/dev/null
              while true; do
                for host in \
                  elasticsearch.demo.svc.cluster.local \
                  apm-server.demo.svc.cluster.local \
                  kafka.demo.svc.cluster.local \
                  kibana.demo.svc.cluster.local \
                  demo-app.demo.svc.cluster.local \
                  kube-dns.kube-system.svc.cluster.local; do
                  dig +tcp +time=1 +tries=1 @10.96.0.10 "$host" A >/dev/null 2>&1 || true
                done
                # Fresh TCP dials to CoreDNS — agent only sees ESTABLISHED, so reopen often.
                for _ in 1 2 3 4 5; do
                  nc -z -w1 10.96.0.10 53 >/dev/null 2>&1 || true
                done
                curl -fsS -m 3 http://elasticsearch.demo.svc.cluster.local:9200/ >/dev/null 2>&1 || true
                curl -fsS -m 3 http://apm-server.demo.svc.cluster.local:8200/ >/dev/null 2>&1 || true
                curl -fsS -m 3 http://demo-app.demo.svc.cluster.local:3000/work >/dev/null 2>&1 || true
                sleep 1
              done
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
        - name: kafka-producer
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "waiting for kafka…"
              for i in $(seq 1 90); do
                if rpk topic list --brokers kafka.demo.svc.cluster.local:9092 >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              rpk topic create kern-demo --brokers kafka.demo.svc.cluster.local:9092 || true
              n=0
              while true; do
                n=$((n+1))
                echo "tick-${n}-$(date +%s)" | rpk topic produce kern-demo --brokers kafka.demo.svc.cluster.local:9092 >/dev/null 2>&1 || true
                sleep 2
              done
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
# Kibana UI for Elasticsearch and APM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: demo
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.3
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: ELASTICSEARCH_HOSTS
              value: '["http://elasticsearch.demo.svc.cluster.local:9200"]'
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: XPACK_SECURITY_ENABLED
              value: "false"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: demo
  labels:
    app: kibana
spec:
  selector:
    app: kibana
  ports:
    - name: http
      port: 5601
      targetPort: 5601

# apiVersion: v1
