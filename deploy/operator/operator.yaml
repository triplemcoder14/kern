apiVersion: v1
kind: Namespace
metadata:
  name: kern-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kern-operator
  namespace: kern-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kern-operator
rules:
  - apiGroups: [kern.io]
    resources: [kernmonitors, kernmonitors/status, kernalertrules]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [namespaces, serviceaccounts, services, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kern-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kern-operator
subjects:
  - kind: ServiceAccount
    name: kern-operator
    namespace: kern-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kern-operator
  namespace: kern-system
  labels:
    app: kern-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kern-operator
  template:
    metadata:
      labels:
        app: kern-operator
    spec:
      serviceAccountName: kern-operator
      containers:
        - name: manager
          image: kern/operator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KERN_AGENT_NAMESPACE
              value: kern
          args:
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
