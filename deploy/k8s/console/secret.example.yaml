# Copy to secret.yaml, fill in values, apply once. Do not commit secret.yaml.
#
#   cp secret.example.yaml secret.yaml
#   kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: kern-console-auth
  namespace: kern-console
type: Opaque
stringData:
  KERN_USERNAME: admin
  KERN_PASSWORD: change-me-on-install
  KERN_AUTH_SECRET: replace-with-a-long-random-string
