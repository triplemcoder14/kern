# Production on VPS — proxied by fundtrail nginx (fundtrail_default network).
#
#   cd /opt/kern/deploy/docker
#   cp .env.example .env   # optional, for kern-api OAuth
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  kern-web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    container_name: kern-web
    restart: unless-stopped
    networks:
      - fundtrail_proxy

  kern-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: kern-api
    env_file: .env
    restart: unless-stopped
    profiles:
      - api
    networks:
      - fundtrail_proxy
    volumes:
      - kern-data:/var/lib/kern/data

networks:
  fundtrail_proxy:
    external: true
    name: fundtrail_default

volumes:
  kern-data:
