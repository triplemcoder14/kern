# KERN API — runs behind your existing nginx (proxy /api and /monitor/ws).
#
# On the VPS:
#   cd /opt/kern/deploy/docker
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
#
# nginx on the host proxies to 127.0.0.1:3000 (see deploy/nginx/kern-locations.conf).

services:
  kern-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - kern-data:/var/lib/kern/data
    restart: unless-stopped

volumes:
  kern-data:
