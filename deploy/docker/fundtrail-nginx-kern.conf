# Append to fundtrail nginx/nginx-active.conf
# Reload: docker exec fundtrail-nginx-1 nginx -s reload

upstream kern_web {
    server kern-web:80;
    keepalive 8;
}

# HTTP — certbot + redirect (after TLS is issued)
server {
    listen 80;
    server_name kern.muutassim.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — kern.muutassim.xyz landing
server {
    listen 443 ssl;
    http2 on;
    server_name kern.muutassim.xyz;

    ssl_certificate /etc/letsencrypt/live/kern.muutassim.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kern.muutassim.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        proxy_pass http://kern_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# Optional API routes — append fundtrail-nginx-kern-api.conf when kern-api is running
