apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kern
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/triplemcoder14/kern.git
  ref:
    # Pin to a release tag for reproducible installs, e.g. tag: v0.1.0
    branch: master
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kern
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: kern-system
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./deploy/helm/kern
      sourceRef:
        kind: GitRepository
        name: kern
        namespace: flux-system
  values:
    agent:
      imagePullPolicy: IfNotPresent
    operator:
      imagePullPolicy: IfNotPresent
    alertRules:
      enabled: true
