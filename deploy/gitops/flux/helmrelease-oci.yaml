# Flux GitOps — pull the published OCI Helm chart (no git clone required).
# Requires: helm-controller + a prior release tag pushed (see .github/workflows/release.yml).
#
#   kubectl apply -f deploy/gitops/flux/helmrelease-oci.yaml
#
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: kern
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/triplemcoder14/charts/kern
  ref:
    semver: ">=0.1.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kern
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: kern-system
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: kern
    namespace: flux-system
  values:
    alertRules:
      enabled: true
