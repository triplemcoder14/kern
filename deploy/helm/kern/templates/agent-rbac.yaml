apiVersion: v1
kind: ServiceAccount
metadata:
  name: kern-agent
  namespace: {{ .Values.operator.agentNamespace }}
  labels:
    {{- include "kern.labels" . | nindent 4 }}
    app: kern-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kern-agent
  labels:
    {{- include "kern.labels" . | nindent 4 }}
    app: kern-agent
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kern-agent
  labels:
    {{- include "kern.labels" . | nindent 4 }}
    app: kern-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kern-agent
subjects:
  - kind: ServiceAccount
    name: kern-agent
    namespace: {{ .Values.operator.agentNamespace }}
