apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kernalertrules.kern.io
spec:
  group: kern.io
  names:
    kind: KernAlertRule
    listKind: KernAlertRuleList
    plural: kernalertrules
    singular: kernalertrule
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: true
                type:
                  type: string
                  enum: [latency, drop, timeout, silence, spike]
                severity:
                  type: string
                  enum: [warning, critical]
                threshold:
                  type: object
                  properties:
                    latencyMs:
                      type: integer
                    spikeFactor:
                      type: number
                    minPriorFlows:
                      type: integer
                match:
                  type: object
                  properties:
                    namespace:
                      type: string
                    pathContains:
                      type: string
                    verdict:
                      type: string
                title:
                  type: string
                cause:
                  type: string
              required: [type, severity]
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Severity
          type: string
          jsonPath: .spec.severity
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
