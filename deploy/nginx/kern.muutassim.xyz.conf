# Reference only — add to your EXISTING nginx, do not run a second nginx install.
#
# Option A (recommended): extend the server block you already use for kern.muutassim.xyz
#
#   root /var/www/kern;
#   index index.html;
#   include /etc/nginx/snippets/kern-locations.conf;
#
# Option B: new server block in sites-enabled (same nginx process — not a new nginx)
#   Copy this file to sites-available and symlink sites-enabled if the vhost does not exist yet.
#
# Then: sudo nginx -t && sudo systemctl reload nginx
# Deploy files from laptop: npm run deploy:landing

server {
    listen 80;
    listen [::]:80;
    server_name kern.muutassim.xyz;

    root /var/www/kern;
    index index.html;

    include /etc/nginx/snippets/kern-locations.conf;
}
