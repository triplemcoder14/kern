# KERN marketing site — trykern.xyz
# Install: sudo cp deploy/nginx/trykern.xyz.conf /etc/nginx/sites-available/trykern.xyz
#          sudo ln -sf /etc/nginx/sites-available/trykern.xyz /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name trykern.xyz www.trykern.xyz;

    root /var/www/trykern;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /favicon.svg {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
