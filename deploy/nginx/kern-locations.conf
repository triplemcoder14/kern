# Include inside your existing server { } block for kern.muutassim.xyz
# Example in /etc/nginx/sites-available/your-site:
#
#   server {
#       listen 443 ssl http2;
#       server_name kern.muutassim.xyz;
#       ...
#       root /var/www/kern;
#       index index.html;
#       include /etc/nginx/snippets/kern-locations.conf;
#   }
#
# Or copy these location blocks directly into your server block.

location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location /favicon.svg {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Optional — only if KERN API runs on this host (OAuth + console)
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /monitor/ws {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}

# SPA — landing (/) and console (/app)
location / {
    try_files $uri $uri/ /index.html;
}
